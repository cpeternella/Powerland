<style>
/* Layout: fixed left rail (navigation) + working canvas; sticky live-result strip on top of the canvas */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface-2:#E8ECF0; --ink:#15212C; --muted:#586878; --line:#D3DAE1;
  --accent:#B0532A; --accent-ink:#FFFFFF; --accent-soft:#F5E3D9; --steel:#2E5D84; --steel-soft:#DCE7F1;
  --pos:#2C7A4C; --pos-soft:#DDEFE4; --neg:#B03636; --neg-soft:#F6DEDE; --warn:#9A6E0E;
  --side:#15212C; --side-2:#1E2C39; --side-fg:#E6ECF1; --side-muted:#8FA0B0; --side-line:#2B3B49;
  --input:#FFFFFF; --input-line:#C5CED7; --edit:#FFF8E6; --edit-line:#E6C77A;
  --shadow:0 1px 2px rgba(20,33,44,.06),0 4px 16px rgba(20,33,44,.06);
  --f-display:"Archivo","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D141B; --surface:#141E28; --surface-2:#1B2733; --ink:#E4EBF1; --muted:#93A4B4; --line:#283745;
  --accent:#E2864F; --accent-ink:#1A0E07; --accent-soft:#3A2418; --steel:#76A9D3; --steel-soft:#1C3145;
  --pos:#5DC28C; --pos-soft:#173226; --neg:#EC7474; --neg-soft:#3B1C1E; --warn:#DDAE45;
  --side:#090F15; --side-2:#121C26; --side-fg:#E4EBF1; --side-muted:#7F92A3; --side-line:#1E2B37;
  --input:#101921; --input-line:#33465A; --edit:#2A2412; --edit-line:#6B5520;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D141B; --surface:#141E28; --surface-2:#1B2733; --ink:#E4EBF1; --muted:#93A4B4; --line:#283745;
  --accent:#E2864F; --accent-ink:#1A0E07; --accent-soft:#3A2418; --steel:#76A9D3; --steel-soft:#1C3145;
  --pos:#5DC28C; --pos-soft:#173226; --neg:#EC7474; --neg-soft:#3B1C1E; --warn:#DDAE45;
  --side:#090F15; --side-2:#121C26; --side-fg:#E4EBF1; --side-muted:#7F92A3; --side-line:#1E2B37;
  --input:#101921; --input-line:#33465A; --edit:#2A2412; --edit-line:#6B5520;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}

[hidden]{display:none !important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.5rem;font-weight:700}
h2{font-size:1.1rem;font-weight:700}
h3{font-size:.95rem;font-weight:650}
.num,td.n,th.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.eyebrow{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}

/* ---------- login */
#login{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px;background-position:-1px -1px}
.login-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:28px;display:grid;gap:18px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:34px;height:34px;flex:none}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:.02em}
.brand-sub{font-size:.75rem;color:var(--muted)}
.field{display:grid;gap:5px}
.field label{font-size:.78rem;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--input);border:1px solid var(--input-line);border-radius:var(--r);padding:8px 10px;min-width:0;width:100%}
.login-note{font-size:.75rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.err{color:var(--neg);font-size:.82rem;min-height:1.2em}

/* ---------- buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--input-line);background:var(--surface);border-radius:var(--r);padding:7px 12px;cursor:pointer;font-weight:600;font-size:.85rem;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--neg);border-color:var(--neg)}
.btn.sm{padding:4px 9px;font-size:.78rem}
.btn.ghost{border-color:transparent;background:transparent}
.seg{display:inline-flex;border:1px solid var(--input-line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 10px;cursor:pointer;font-weight:600;font-size:.8rem}
.seg button+button{border-left:1px solid var(--input-line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* ---------- shell */
#app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
#side{background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;padding-block:18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;gap:16px}
#side .brand-sub{color:var(--side-muted)}
nav.menu{display:grid;gap:2px}
nav.menu .grp{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--side-muted);padding:12px 10px 4px;font-weight:600}
nav.menu a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);color:var(--side-fg);text-decoration:none;font-weight:500;font-size:.88rem}
nav.menu a svg{width:16px;height:16px;flex:none;opacity:.75}
nav.menu a:hover{background:var(--side-2)}
nav.menu a[aria-current="page"]{background:var(--side-2);box-shadow:inset 3px 0 0 var(--accent)}
nav.menu a[aria-current="page"] svg{opacity:1;color:var(--accent)}
.side-foot{margin-top:auto;border-top:1px solid var(--side-line);padding-top:12px;font-size:.78rem;color:var(--side-muted);display:grid;gap:8px}
.side-foot .btn{background:transparent;color:var(--side-fg);border-color:var(--side-line)}

#main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.topbar .scen{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.topbar .scen b{font-family:var(--f-display);font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fx{display:flex;align-items:center;gap:6px;font-size:.8rem}
.fx input{width:72px;background:var(--input);border:1px solid var(--input-line);border-radius:var(--r);padding:5px 7px;font-family:var(--f-mono)}
#burger{display:none}
.strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.strip div{background:var(--surface-2);padding:8px 14px;min-width:0}
.strip div:first-child{padding-left:max(16px,env(safe-area-inset-left,0px))}
.strip .k{font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .v{font-family:var(--f-mono);font-size:.98rem;font-weight:600;white-space:nowrap}
#view{padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px;align-content:start;min-width:0}
.vhead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;justify-content:space-between}
.vhead p{margin:4px 0 0;color:var(--muted);max-width:70ch}

/* ---------- panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:12px;min-width:0}
.panel>header{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:baseline}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:4px;min-width:0}
.tile .k{font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.tile .v{font-family:var(--f-display);font-size:1.55rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:.78rem;color:var(--muted)}
.tile.hero{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tile.hero .k,.tile.hero .s{color:color-mix(in srgb,var(--surface) 70%,var(--ink))}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.72rem;font-weight:700;letter-spacing:.02em}
.pill.pos{background:var(--pos-soft);color:var(--pos)}
.pill.neg{background:var(--neg-soft);color:var(--neg)}
.pill.neu{background:var(--steel-soft);color:var(--steel)}
.pos{color:var(--pos)} .neg{color:var(--neg)}

/* sliders */
.sliders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 28px}
.sl{display:grid;gap:6px}
.sl .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sl .top label{font-weight:650}
.sl .top output{font-family:var(--f-mono);font-weight:600;font-size:1.05rem;color:var(--accent)}
.sl input[type=range]{width:100%;accent-color:var(--accent)}
.sl .scale{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);font-family:var(--f-mono)}
.sl .sub{font-size:.75rem;color:var(--muted)}

/* gate timeline */
.timeline{position:relative;height:74px;margin-inline:6px}
.timeline .axis{position:absolute;left:0;right:0;top:34px;height:4px;background:var(--surface-2);border-radius:2px}
.timeline .done{position:absolute;left:0;top:34px;height:4px;background:var(--steel);border-radius:2px}
.timeline .g{position:absolute;top:0;transform:translateX(-50%);text-align:center;font-size:.7rem;white-space:nowrap}
.timeline .g b{display:block;font-family:var(--f-display);font-size:.8rem}
.timeline .g i{display:block;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--steel);margin:5px auto 0}
.timeline .g.close i{border-color:var(--accent);background:var(--accent)}
.timeline .g .m{display:block;margin-top:6px;color:var(--muted);font-family:var(--f-mono)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:.82rem}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:650;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;background:var(--surface-2);position:sticky;top:0;z-index:1}
td.n,th.n{text-align:right}
tr.tot td{font-weight:700;background:var(--surface-2)}
tr.sub td{font-weight:650}
tr.hl td{background:var(--accent-soft)}
td.wrap{white-space:normal;min-width:220px}
.tw.tall{max-height:70vh;overflow:auto}

/* spreadsheet grid */
.sheet{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-width:100%}
.sheet table{font-size:.78rem;width:auto}
.sheet th,.sheet td{padding:0;border-right:1px solid var(--line)}
.sheet th{padding:5px 6px;text-align:center}
.sheet thead th{top:0}
.sheet .sc{position:sticky;left:0;z-index:2;background:var(--surface);width:64px;min-width:64px;max-width:64px}
.sheet .sc2{position:sticky;left:64px;z-index:2;background:var(--surface)}
.sheet thead .sc,.sheet thead .sc2{z-index:3;background:var(--surface-2)}
.sheet td input{width:76px;border:0;background:transparent;padding:5px 6px;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sheet td input:focus{background:var(--edit);outline:1px solid var(--edit-line);outline-offset:-1px}
.sheet td input.nz{color:var(--ink);font-weight:600}
.sheet td input:not(.nz){color:var(--muted)}
.sheet td.after{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--surface-2) 6px 7px)}
.sheet th.gm{background:var(--steel-soft);color:var(--steel)}
.sheet th.cm{background:var(--accent-soft);color:var(--accent)}
.sheet td.name input{width:260px;text-align:left;font-family:var(--f-body)}
.sheet td.name{min-width:260px}
.sheet td select{border:0;background:transparent;padding:5px 4px;font-weight:700}
.sheet td.tot{padding:5px 8px;text-align:right;font-family:var(--f-mono);font-weight:700;background:var(--surface-2)}
.sheet td.chk{text-align:center}
.sheet tr.rec td.name input{color:var(--steel)}
.sheet tfoot td{padding:5px 6px;text-align:right;font-family:var(--f-mono);font-weight:700;background:var(--surface-2);position:sticky;bottom:0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .field{display:flex;align-items:center;gap:6px}
.toolbar .field input{width:90px;padding:5px 7px}

/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px 18px}
.form .field .hint{font-size:.72rem;color:var(--muted)}
.inwrap{display:flex;align-items:center;background:var(--input);border:1px solid var(--input-line);border-radius:var(--r)}
.inwrap input{border:0 !important;background:transparent !important;font-family:var(--f-mono)}
.inwrap span{padding:0 9px;color:var(--muted);font-size:.78rem;white-space:nowrap}
td input.cell{width:100%;min-width:70px;background:var(--input);border:1px solid var(--input-line);border-radius:4px;padding:4px 6px;font-family:var(--f-mono);text-align:right}
td input.cell.txt{text-align:left;font-family:var(--f-body);min-width:200px}

/* heat matrix */
.mx td.n{min-width:84px}
.mx td.c0{background:var(--neg-soft);color:var(--neg)}
.mx td.c1{background:var(--pos-soft);color:var(--pos)}
.mx td.cur{outline:2px solid var(--accent);outline-offset:-2px;font-weight:700}
.mx th.rowh{position:sticky;left:0;z-index:2}

.chart{position:relative;height:280px}
.chart.sm{height:220px}
.note{font-size:.78rem;color:var(--muted);max-width:90ch}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:.8rem}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:var(--r);font-size:.85rem;z-index:50;box-shadow:var(--shadow)}
.badge{font-size:.7rem;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-weight:600}
.cards{display:grid;gap:10px}
.scard{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:var(--surface)}
.scard .meta{min-width:0;flex:1 1 220px}
.scard .meta b{font-family:var(--f-display)}
.scard .kp{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem}
.scard .kp span b{font-family:var(--f-mono)}
textarea.code{width:100%;min-height:140px;font-family:var(--f-mono);font-size:.75rem;background:var(--input);border:1px solid var(--input-line);border-radius:var(--r);padding:8px}

@media (max-width:1100px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.strip{grid-template-columns:repeat(3,minmax(0,1fr))}.grid3{grid-template-columns:1fr}}
@media (max-width:860px){
  #app{grid-template-columns:minmax(0,1fr)}
  #side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:40;transform:translateX(-105%);transition:transform .2s ease;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  #app.open #side{transform:none}
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30}
  #burger{display:inline-flex}
  .grid2,.sliders{grid-template-columns:1fr}
}
@media (max-width:520px){.tiles{grid-template-columns:1fr 1fr}.tile .v{font-size:1.1rem;white-space:normal}.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

.scenrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-right:auto;min-width:0}
.scenrow .scen{margin-right:0}
.taxseg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.tabs{flex-wrap:wrap;justify-self:start;max-width:100%}
.seg.tabs button{padding:8px 14px;font-size:.85rem}

</style>

function addMonths(iso,n){const [y,m,d]=iso.split('-').map(Number);const t=new Date(Date.UTC(y,m-1+n,1));const last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();return new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth(),Math.min(d,last)));}
function dayDiff(a,b){return Math.round((b-a)/86400000);}

function irrMonthly(cf){ // returns annualized (1+r)^12-1
  const npv=r=>{let s=0;for(let t=0;t<cf.length;t++)s+=cf[t]/Math.pow(1+r,t);return s;};
  let lo=-0.99,hi=1, flo=npv(lo), fhi=npv(hi);
  if(!(isFinite(flo)&&isFinite(fhi))||flo*fhi>0) return null;
  for(let i=0;i<200;i++){const mid=(lo+hi)/2,f=npv(mid);if(Math.abs(f)<1e-9)break;if(f*flo>0){lo=mid;flo=f;}else{hi=mid;}}
  const r=(lo+hi)/2;return Math.pow(1+r,12)-1;
}
function xirr(cf,days){
  const npv=r=>{let s=0;for(let t=0;t<cf.length;t++)s+=cf[t]/Math.pow(1+r,days[t]/365);return s;};
  let lo=-0.99,hi=10,flo=npv(lo),fhi=npv(hi);
  if(!(isFinite(flo)&&isFinite(fhi))||flo*fhi>0) return null;
  for(let i=0;i<300;i++){const mid=(lo+hi)/2,f=npv(mid);if(f*flo>0){lo=mid;flo=f;}else{hi=mid;}}
  return (lo+hi)/2;
}

function opexSeries(S){
  const tot=new Array(NM).fill(0), rows=[];
  for(const o of S.opex){
    const end=(o.end==='C'||o.end===''||o.end==null)?S.closing:+o.end, st=+o.start||0;
    const r=new Array(NM).fill(0);
    for(let t=0;t<NM;t++) if(t>=st&&t<=end) r[t]=(+o.val||0)*Math.pow(1+(+o.adj||0),Math.floor((t-st)/12));
    rows.push(r); for(let t=0;t<NM;t++) tot[t]+=r[t];
  }
  return {tot,rows};
}

function run(S, ov){

  const N=NM, C=S.closing, cont=S.contingency, mult=S.capexMult==null?1:S.capexMult;
  const riskOn=S.risk===1;

  const X=ox.tot, E=capexT.map((v,t)=>v+X[t]);
  const term=Math.max(1,Math.round(S.termMonths||1));
  const H=new Array(N).fill(0);

  // DRE / tax

    V.push(i-(t===0?S.land:0));
    const ac=-E[t]+G[t]-R[t]*S.inclGar; AC.push(ac); AD.push(ac/L[t]); AE.push(ac-(t===0?S.land:0));
    cumE+=E[t]; W.push(cumE);
  }
  const sum=a=>a.reduce((x,y)=>x+y,0);
  const G71=sum(E), G72=R.filter(v=>v>0).reduce((a,b)=>a+b,0), G73=G71+G72, G74=sum(G), G75=S.land+G71;
  const minT=Math.min(...T), peakM=T.indexOf(minT);
  let payback=null; for(let t=peakM+1;t<N;t++) if(T[t]>=0){payback=t;break;}
  const taxesRev=sum(Y), taxesTrans=sum(Z), taxesIR=sum(AA);
  // milestones
  const cpM=[0,...gm,C];
  const probFrom=k=>{ // E90..E96

  const cps=cpM.map((m,k)=>{
    let VA,VC,VCpre;
    if(k===0){VA=sum(K);VC=sum(M);VCpre=sum(AD);}
    else if(k===6){VA=I[m]||0;VC=I[m]||0;let s=0;for(let t=m;t<N;t++)s+=AD[t];VCpre=s*L[m];}
    else{let a=0,c=0,p=0;for(let t=m+1;t<N;t++){a+=I[t]/Math.pow(1+S.wacc,(t-m)/12);c+=I[t]/L[t];p+=AD[t];}VA=a;VC=c*L[m];VCpre=p*L[m];}
    const pr=probFrom(k);
    return {k,m,gate:k===0?'G0':S.gates[k-1].code,prob:pr,VA,VB:VA*pr,VC,VCpre,costAcc:k===0?0:W[m],perMW:VC/S.mw,perMWpre:VCpre/S.mw};
  });
  // capital per milestone (Fluxo_Milestone)
  const fm=cpM.map((m,k)=>{let g=0,rev=0;for(let t=0;t<=m&&t<N;t++){g+=R[t];rev+=G[t];}return {k,m,D:W[m],E:g,F:W[m]+g,J:rev,K:cps[k].VC};});
  fm.forEach((r,k)=>{if(k<6){const nx=fm[k+1];r.G=nx.D-r.D;r.H=nx.E-r.E;r.I=r.G+r.H;r.Lv=Math.max(0,cps[k+1].VC-cps[k].VC);}else{r.G=0;r.H=0;r.I=0;r.Lv=0;}});
  // funding (cash waterfall)
  let cash=0, aportes=0; const aport=[], cashEnd=[];

// ---- derived analyses
function breakevenPre(S){
  const r=run(S,{price:1}); // revenue linear in price (H independent)
  const DF=t=>1/Math.pow(1+S.wacc,t/12); let sF=0,sR=0,sH=0;
  for(let t=0;t<r.N;t++){sF+=r.F[t]*DF(t);sR+=r.R[t]*DF(t);sH+=r.H[t]*DF(t);}
  return -(sF-S.inclGar*sR)/(S.mw*sH);
}
function solvePrice(S,fn,target){ // find price s.t. fn(run)=target, monotone increasing in price
  let lo=0,hi=50000; const f=p=>fn(run(S,{price:p}))-target;
  if(f(lo)>0) return 0; if(f(hi)<0) return null;
  for(let i=0;i<80;i++){const mid=(lo+hi)/2;if(f(mid)>0)hi=mid;else lo=mid;}
  return (lo+hi)/2;
}
function breakevenPost(S){return solvePrice(S,r=>r.kpi.npvA,0);}
function breakevenPostC(S){return solvePrice(S,r=>r.kpi.npvC,0);}
function hurdlePrice(S,h,m,r){
  r=r||run(S);
  const d0=r.dates[0]; let pv=-S.land, cum=0;
  for(let t=0;t<=m&&t<r.N;t++){pv+=-r.E[t]/Math.pow(1+h,r.days[t]/365);cum+=r.E[t];}
  const dm=dayDiff(d0,addMonths(S.baseDate,m));
  const req=-pv*Math.pow(1+h,dm/365);
  const q=1-S.taxRevenue-S.transCost; const base=S.land+cum;
  const gross=req<=base? req/q : (req-S.irpj*base)/((1-S.irpj)*q);
  return gross/S.mw;
}

function calc(){
  S.gates[5].month=S.closing;

  BE={pre:breakevenPre(S),post:breakevenPost(S),c:breakevenPostC(S)};
}

  if(opts.rerender!==false && ['painel','comparacao','fluxo','valuation','capital','dre','sens','cenarios'].includes(VIEW)) renderView(true);
}

async function hash(s){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('powerland|'+s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
  catch(e){let h=2166136261;for(const c of 'powerland|'+s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return 'f'+(h>>>0).toString(16);}
}

async function doLogin(e){
  e.preventDefault();
  const u=$('#lu').value.trim().toLowerCase(), p=$('#lp').value, list=await users(), h=await hash(p);
  if(list.find(x=>x.u===u&&x.h===h)){ssSet('pl_session',u);boot();}
  else{$('#lerr').textContent=t('badLogin');}
}

/* ================= router ================= */
function route(){
  const h=(location.hash||'').replace('#','');
  VIEW=VKEY[h]?h:'painel';
  $$('nav.menu a').forEach(a=>a.setAttribute('aria-current',a.dataset.v===VIEW?'page':'false'));
  renderView(false);
}
function destroyCharts(){CHARTS.forEach(c=>{try{c.destroy();}catch(e){}});CHARTS=[];}
function renderView(keepScroll){
  const y=window.scrollY; destroyCharts();
  const fn=VIEWS[VIEW]; const V=$('#view'); V.innerHTML=fn.html(); fn.bind&&fn.bind();
  if(keepScroll) window.scrollTo(0,y); else window.scrollTo(0,0);
}

  return pre?[
    [`${t('r_m0')} ${tag}`,fM(k.npvCpre),`${fPMW(k.npvCpre/S.mw)} · ${S.risk===1?t('riskOn'):t('riskOff')}`,'hero'],
    [t('r_close'),fM(k.closeValPre),fPMW(k.closeValPre/S.mw)],
    [t('k_irrEmp'),pct(k.irrEmpPre),`${t('k_irrProj')}: ${pct(k.irrProjPre)}`],
    [t('r_moic'),xx(k.moicPre),`${t('k_result')}: ${fM(k.resultPre)}`],
    [t('k_m0'),fM(k.npvC),`${t('taxDrag')}: ${fM(k.npvCpre-k.npvC)}`],
    [t('k_peak'),fM(k.peakPre),`${t('peakMonth')}: ${k.peakMonthPre} · ${t('payback')}: ${k.paybackPre??'–'}`],
    [t('k_be'),fPMW(be),`${t('margin')}: <span class="pill ${margin>=0?'pos':'neg'}">${pct(margin)}</span>`],
    [t('k_prob'),pct(p),`WACC ${pct(S.wacc)} · hurdle ${pct(S.hurdle,0)}`]
  ]:[
    [`${t('k_m0')} ${tag}`,fM(k.npvC),`${fPMW(k.npvC/S.mw)} · ${S.risk===1?t('riskOn'):t('riskOff')}`,'hero'],
    [t('k_close'),fM(k.closeVal),fPMW(k.closeVal/S.mw)],
    [t('k_irrEmp'),pct(k.irrEmp),`${t('k_irrProj')}: ${pct(k.irrProj)}`],
    [t('k_moic'),xx(k.moic),`${t('k_result')}: ${fM(k.result)}`],
    [t('k_m0pre'),fM(k.npvCpre),`${t('r_irrEmp')}: ${pct(k.irrEmpPre)}`],
    [t('k_peak'),fM(k.peak),`${t('peakMonth')}: ${k.peakMonth} · ${t('payback')}: ${k.payback??'–'}`],
    [t('k_be'),fPMW(be),`${t('margin')}: <span class="pill ${margin>=0?'pos':'neg'}">${pct(margin)}</span>`],
    [t('k_prob'),pct(p),`WACC ${pct(S.wacc)} · hurdle ${pct(S.hurdle,0)}`]
  ];
}

function updatePainel(){ // light refresh during drag
  const tl=painelTiles();
  $$('.tiles .tile').forEach((el,i)=>{if(!tl[i])return;el.querySelector('.v').textContent=tl[i][1];el.querySelector('.s').innerHTML=tl[i][2];});
  const c1=CHARTS[0],c2=CHARTS[1],pre=TAXM==='pre',n=lastM()+1;
  if(c1){const a=R.cps.map(c=>c.VC),b=R.cps.map(c=>c.VCpre);c1.data.datasets[0].data=pre?b:a;c1.data.datasets[1].data=pre?a:b;c1.update('none');}
  if(c2){c2.data.datasets[0].data=(pre?R.Tpre:R.T).slice(0,n);c2.data.datasets[1].data=(pre?R.AC:R.I).slice(0,n);c2.update('none');}
}
function lastM(){return Math.min(60,S.closing+Math.max(1,S.termMonths||1)+2);}
function timeline(){
  const max=Math.max(S.closing,...S.gates.slice(0,5).map(g=>+g.month))+2;
  const pos=m=>`${(m/max*100).toFixed(2)}%`;
  const items=S.gates.map((g,i)=>{const m=i===5?S.closing:+g.month;return `<div class="g ${i===5?'close':''}" style="left:${pos(m)}" title="${esc(nm(g))}"><b>${g.code}</b><i></i><span class="m">${t('mo')} ${m}</span></div>`;}).join('');
  return `<div class="timeline"><div class="axis"></div><div class="done" style="width:${pos(S.closing)}"></div>${items}</div>`;
}

  sheet.addEventListener('paste',e=>{
    const el=e.target;if(!el.dataset||el.dataset.m==null)return;

    e.preventDefault();const r0=+el.dataset.r,m0=+el.dataset.m;
    txt.replace(/\r/g,'').split('\n').filter((l,i,a)=>l!==''||i<a.length-1).forEach((line,i)=>{const it=S.capex[r0+i];if(!it)return;line.split('\t').forEach((c,j)=>{const m=m0+j;if(m<NM)it.m[m]=parseNum(c);});});

    $('#cdy').onclick=()=>{S.capex.splice(i,1);SEL_ROW=null;changed({rerender:false});renderView(true);};$('#cdn').onclick=()=>$('#delbox').innerHTML='';});

    if(!isFinite(tot)||!(b>=a)||a<0||b>60)return;const it=S.capex[SEL_ROW];it.m=it.m.map((v,m)=>m>=a&&m<=b?+(tot/(b-a+1)).toFixed(4):0);changed({rerender:false});renderView(true);};
  $('#b_rcap').onclick=()=>{S.capex=clone(BASE.capex);changed({rerender:false});renderView(true);};
}};
function parseNum(s){s=String(s).trim();if(!s)return 0;if(LANG==='pt'||/,\d{1,2}$/.test(s)&&!/\.\d{3}$/.test(s)){s=s.replace(/\./g,'').replace(',','.');}else s=s.replace(/,/g,'');const v=parseFloat(s);return isFinite(v)?v:0;}
function refreshCapexTotals(){
  S.capex.forEach((it,i)=>{const el=$(`[data-tot="${i}"]`);if(el){const v=it.rec?it.m.filter(v=>v>0).reduce((a,b)=>a+b,0):it.m.reduce((a,b)=>a+(+b||0),0);el.textContent=nf(v,0);}});
  let all=0;for(let m=0;m<NM;m++){const v=S.capex.filter(x=>!x.rec).reduce((a,x)=>a+(+x.m[m]||0),0);all+=v;const el=$(`[data-ct="${m}"]`);if(el)el.textContent=v?nf(v,0):'';}

function gateSummary(){

/* ---------- Demonstrativos: DRE, Balanço, Fluxo de caixa, Fontes e Usos */
function yearIdx(){const yrs=[...new Set(R.dates.map(x=>x.getUTCFullYear()))];return yrs.map(y=>({y,idx:R.dates.map((x,i)=>x.getUTCFullYear()===y?i:-1).filter(i=>i>=0)}));}
function stmtTable(lines,mode){ // mode per line: 'sum' (default) or 'end' / 'start'
  const Y=yearIdx();
  const cell=x=>`<td class="n ${x<-0.5?'neg':''}">${Math.abs(x)<0.5?'–':fK(x)}</td>`;
  const body=lines.map(l=>{
    if(l.hdr) return `<tr><td colspan="${Y.length+2}" class="eyebrow" style="padding-top:14px">${l.hdr}</td></tr>`;
    const m=l.m||'sum', a=l.a;
    const v=Y.map(({idx})=>m==='end'?a[idx[idx.length-1]]:m==='start'?a[idx[0]]:idx.reduce((s,i)=>s+a[i],0));
    const tot=m==='end'?a[a.length-1]:m==='start'?a[0]:a.reduce((x,y)=>x+y,0);
    return `<tr class="${l.c||''}"><td>${l.l}</td>${v.map(cell).join('')}<td class="n"><b>${Math.abs(tot)<0.5?'–':fK(tot)}</b></td></tr>`;}).join('');
  return `<div class="tw"><table><thead><tr><th>${uK()}</th>${Y.map(o=>`<th class="n">${o.y}</th>`).join('')}<th class="n">${mode==='bs'?t('end60'):t('total')}</th></tr></thead><tbody>${body}</tbody></table></div>`;
}
function fuTables(){
  const f=R.fu;
  const src=[[t('s_land'),f.land],[t('s_aport'),f.aportes],[t('s_rev'),f.revenue],[t('s_guar'),f.guarRel]];
  const use=[[t('u_land'),f.land],[t('u_dev'),f.dev],[t('u_guar'),f.guarPost],[t('u_pis'),f.pis],[t('u_trans'),f.trans],[t('u_ir'),f.ir],[t('u_dist'),f.dist]];
  const tb=(list,tot)=>`<table><tbody>${list.map(([a,v])=>`<tr><td>${a}</td><td class="n">${fK(v)}</td><td class="n">${pct(tot?v/tot:0)}</td></tr>`).join('')}<tr class="tot"><td>${t('total')}</td><td class="n">${fK(tot)}</td><td class="n">100%</td></tr></tbody></table>`;
  return `<div class="grid2">
   <section class="panel"><header><h2>${t('sources')}</h2><span class="muted">${uK()}</span></header><div class="tw">${tb(src,f.srcTot)}</div></section>
   <section class="panel"><header><h2>${t('uses')}</h2><span class="muted">${uK()} · ${t('check')}: ${fK(f.srcTot-f.useTot)}</span></header><div class="tw">${tb(use,f.useTot)}</div></section></div>`;
}

async function exportJSON(obj){

async function saveScenario(overwrite){
  const name=($('#sc_name').value||'').trim()||`${t('scenario')} ${new Date().toLocaleDateString(loc())}`, notes=$('#sc_notes').value||'';
  const shared=$('#sc_share')&&$('#sc_share').value==='1';
  const now=Date.now(); const doc={name,notes,stateJson:JSON.stringify(S),updatedAt:now,createdAt:now};
  try{
    if(STORE.mode==='db'){
      const col=shared?STORE.db.collection('scenarios'):STORE.db.collection(`data/users/${STORE.uid}/app/scenarios`);
      if(overwrite&&ACTIVE.id&&ACTIVE.store===(shared?'team':'mine')){await col.doc(ACTIVE.id).set(doc);}
      else{const ref=await col.add(doc);ACTIVE.id=ref.id;}
      ACTIVE.store=shared?'team':'mine';
    }else{
      const arr=lsGet('pl_scen',[]);
      if(overwrite&&ACTIVE.id){const i=arr.findIndex(x=>x.id===ACTIVE.id);if(i>=0)arr[i]=Object.assign(arr[i],doc,{createdAt:arr[i].createdAt});}
      else{ACTIVE.id='s'+now;arr.push(Object.assign({id:ACTIVE.id},doc));}
      lsSet('pl_scen',arr);loadLocal();ACTIVE.store='mine';
    }
    ACTIVE.name=name;DIRTY=false;lsSet('pl_work',{S,ACTIVE,DIRTY});renderTop();renderView(true);toast(t('saved'));
  }catch(e){toast((e&&e.message)||'Erro');}
}
async function deleteScenario(id){

    if(sc.store==='local'){lsSet('pl_scen',lsGet('pl_scen',[]).filter(x=>x.id!==id));loadLocal();}
    else if(sc.store==='team'){await STORE.db.collection('scenarios').doc(id).delete();}
    else{await STORE.db.collection(`data/users/${STORE.uid}/app/scenarios`).doc(id).delete();}
    if(ACTIVE.id===id){ACTIVE.id=null;}CMP.delete(id);renderView(true);toast(t('deleted'));
  }catch(e){toast((e&&e.message)||'Erro');}
}

function loadLocal(){SCEN.mine=lsGet('pl_scen',[]).map(x=>{let st=null;try{st=JSON.parse(x.stateJson);}catch(e){}return st?Object.assign({},x,{state:st,store:'local'}):null;}).filter(Boolean).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));}
async function initStore(){

  if(!isAdmin()) return;
  $('#f_u').onsubmit=async e=>{e.preventDefault();if(!isAdmin())return;const list=await users(),n=$('#nu').value.trim().toLowerCase();
    if(!/^[a-z0-9._-]{2,32}$/.test(n))return $('#ue').textContent=t('badUser');
    if(list.find(x=>x.u===n))return $('#ue').textContent=t('userExists');if($('#np').value.length<6)return $('#ue').textContent=t('pwShort');
    list.push({u:n,h:await hash($('#np').value)});lsSet('pl_users',list);toast(t('userAdded'));renderView(true);};
  $$('[data-ru]').forEach(b=>b.onclick=()=>{const u=b.dataset.ru,box=b.closest('[data-ubox]');
    box.innerHTML=`<span class="confirm">${t('confirmDelUser')} <button class="btn sm danger" data-y="1" type="button">${t('confirm')}</button><button class="btn sm" data-n="1" type="button">${t('cancel')}</button></span>`;
    box.querySelector('[data-y]').onclick=()=>{if(!isAdmin()||u===ADMIN)return;lsSet('pl_users',lsGet('pl_users',[]).filter(x=>x.u!==u));toast(t('userRemoved'));renderView(true);};
    box.querySelector('[data-n]').onclick=()=>renderView(true);});
  $$('[data-rp]').forEach(b=>b.onclick=()=>{const u=b.dataset.rp,box=b.closest('[data-ubox]');
    box.innerHTML=`<span class="confirm"><input type="password" id="rpw" placeholder="${t('newPw')}" minlength="6" autocomplete="new-password" style="width:150px;background:var(--input);border:1px solid var(--input-line);border-radius:6px;padding:4px 6px"> <button class="btn sm primary" data-y="1" type="button">${t('confirm')}</button><button class="btn sm" data-n="1" type="button">${t('cancel')}</button></span>`;
    box.querySelector('[data-y]').onclick=async()=>{if(!isAdmin())return;const v=$('#rpw').value;if(v.length<6)return toast(t('pwShort'));
      const list=await users(),x=list.find(z=>z.u===u);if(!x)return;x.h=await hash(v);lsSet('pl_users',list);toast(t('pwReset'));renderView(true);};
    box.querySelector('[data-n]').onclick=()=>renderView(true);});
}};

/* ================= boot ================= */
function boot(){
  $('#login').hidden=true;$('#app').hidden=false;
  renderShell();route();
}
(function init(){
  LANG=lsGet('pl_lang','pt');TAXM=lsGet('pl_taxmode','post');document.documentElement.lang=LANG==='pt'?'pt-BR':'en';
  applyTheme(lsGet('pl_theme','system'));
  const w=lsGet('pl_work',null);
  if(w&&w.S&&w.S.capex){S=Object.assign(defaultState(),w.S);ACTIVE=w.ACTIVE||ACTIVE;DIRTY=!!w.DIRTY;}
  calc();
  window.addEventListener('hashchange',()=>{if(!$('#app').hidden)route();});
  if(window.matchMedia)window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(!$('#app').hidden)renderView(true);});
  users().then(list=>{const ses=ssGet('pl_session');if(ses&&list.some(x=>x.u===ses))boot();else{ssSet('pl_session',null);showLogin();}});
  initStore();
})();

</script>
